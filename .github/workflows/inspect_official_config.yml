name: Inspect official public client configuration

on:
  push:
    branches:
      - inspect-official-config
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download official Nuvio release APK
        run: |
          curl --fail --location --retry 3 \
            --output official-nuvio.apk \
            https://github.com/NuvioMedia/NuvioTV/releases/download/0.8.10-beta/app-full-arm64-v8a-release.apk

      - name: Extract public client configuration
        shell: python
        run: |
          import base64
          import json
          import re
          import zipfile

          with zipfile.ZipFile("official-nuvio.apk") as apk:
              blobs = []
              for name in apk.namelist():
                  try:
                      blobs.append(apk.read(name))
                  except Exception:
                      pass
              blob = b"\n".join(blobs)

          all_urls = sorted(set(
              match.decode("ascii", errors="ignore").rstrip(".,;)")
              for match in re.findall(rb"https://[^\\x00-\\x20\\x7f\"'<>]{4,300}", blob)
          ))
          relevant_urls = [
              url for url in all_urls
              if any(marker in url.lower() for marker in ("supabase", "nuvio", "api.", "backend"))
          ]

          jwt_candidates = sorted(set(
              match.decode("ascii")
              for match in re.findall(rb"eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{10,}", blob)
          ))
          publishable_candidates = sorted(set(
              match.decode("ascii")
              for match in re.findall(rb"sb_publishable_[A-Za-z0-9_-]{20,}", blob)
          ))

          decoded_jwts = []
          for token in jwt_candidates:
              try:
                  payload_part = token.split(".")[1]
                  payload_part += "=" * (-len(payload_part) % 4)
                  payload = json.loads(base64.urlsafe_b64decode(payload_part))
                  decoded_jwts.append({"token": token, "payload": payload})
              except Exception:
                  pass

          result = {
              "relevant_urls": relevant_urls,
              "supabase_urls": [u for u in relevant_urls if "supabase" in u.lower()],
              "anon_jwts": [item["token"] for item in decoded_jwts if item["payload"].get("role") == "anon"],
              "decoded_jwt_payloads": [item["payload"] for item in decoded_jwts],
              "publishable_keys": publishable_candidates,
              "source_release": "https://github.com/NuvioMedia/NuvioTV/releases/tag/0.8.10-beta",
          }
          with open("official-public-config.json", "w", encoding="utf-8") as output:
              json.dump(result, output, indent=2)
              output.write("\n")

          print(
              "Extracted public configuration candidates: "
              f"{len(relevant_urls)} relevant URLs, "
              f"{len(decoded_jwts)} JWTs, "
              f"{len(publishable_candidates)} publishable keys."
          )

      - name: Upload extracted configuration
        uses: actions/upload-artifact@v4
        with:
          name: official-public-config
          path: official-public-config.json
          retention-days: 1
          if-no-files-found: error
